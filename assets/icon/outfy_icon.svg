<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7B3FA8;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#4A1275;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="hangerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e8d4f5;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Fondo lila degradado con esquinas redondeadas -->
  <rect width="1024" height="1024" rx="220" ry="220" fill="url(#bgGrad)"/>

  <!-- Percha — gancho superior -->
  <path
    d="M512 210
       a72 72 0 0 1 72 72
       a30 30 0 0 1-60 0
       a12 12 0 0 0-24 0
       a54 54 0 0 0 54 54"
    fill="none"
    stroke="url(#hangerGrad)"
    stroke-width="52"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Percha — barra horizontal curva -->
  <path
    d="M180 556 Q512 420 844 556"
    fill="none"
    stroke="url(#hangerGrad)"
    stroke-width="52"
    stroke-linecap="round"/>

  <!-- Percha — patas izquierda y derecha -->
  <line x1="180" y1="556" x2="180" y2="660"
    stroke="url(#hangerGrad)" stroke-width="52" stroke-linecap="round"/>
  <line x1="844" y1="556" x2="844" y2="660"
    stroke="url(#hangerGrad)" stroke-width="52" stroke-linecap="round"/>

  <!-- Percha — base horizontal inferior -->
  <line x1="155" y1="660" x2="869" y2="660"
    stroke="url(#hangerGrad)" stroke-width="52" stroke-linecap="round"/>

  <!-- Punto decorativo en el centro del gancho -->
  <circle cx="512" cy="282" r="22" fill="#C084FC"/>

  <!-- Texto OUTFY -->
  <text
    x="512"
    y="870"
    text-anchor="middle"
    font-family="'Arial', sans-serif"
    font-size="148"
    font-weight="900"
    letter-spacing="8"
    fill="white"
    opacity="0.95">OUTFY</text>

  <!-- Línea decorativa bajo el texto -->
  <line x1="310" y1="900" x2="714" y2="900"
    stroke="#C084FC" stroke-width="8" stroke-linecap="round"/>

</svg>
